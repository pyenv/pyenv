name: Publish a binary package

on:
  workflow_dispatch:
    inputs:
      version:
        description: A CPython version accepted by `pyenv install`
        required: true
        type: string
      platform:
        description: Platform to build on
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - macos-15

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.platform }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ${{ inputs.platform }}
    env:
      PYENV_ROOT: ${{ github.workspace }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu build prerequisites
        if: runner.os == 'Linux'
        run: ./bin/pyenv install-prerequisites
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install openssl readline sqlite3 xz tcl-tk@8 libb2 zstd
      - name: Build package
        env:
          PYTHON_CONFIGURE_OPTS: --enable-optimizations
        run: |
          VERSION="$(./bin/pyenv latest -f -k "${VERSION%%:*}")"
          entry="$(./bin/pyenv binary package-name "$VERSION")"
          mkdir dist
          cd dist
          "$GITHUB_WORKSPACE/bin/pyenv" binary package --verbose \
            "$VERSION:$entry" \
            --archive-base-url https://pyenv.github.io/pythons/binaries
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "entry=$entry" >> "$GITHUB_ENV"

      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ vars.PYENV_BOT_APP_ID }}
          private-key: ${{ secrets.PYENV_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            pyenv.github.io
            pyenv
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          repository: pyenv/pyenv.github.io
          token: ${{ steps.generate-token.outputs.token }}
          path: site
      - name: Update downloads
        run: |
          mkdir -p site/pythons/binaries
          cp "dist/$entry.tar.xz" "dist/$entry.meta" "dist/$entry" \
            site/pythons/binaries/
          cd site/pythons
          ./update.sh
      - name: Create website Pull Request
        id: site-pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: site
          branch: auto_add_binary/${{ env.entry }}
          title: Add CPython ${{ env.entry }}
          commit-message: Add CPython ${{ env.entry }}
          body: |
            Built from pyenv/pyenv@${{ github.sha }} with profile-guided optimization enabled.

            Part of pyenv/pyenv#2334.
          token: ${{ steps.generate-token.outputs.token }}
      - uses: actions/checkout@v7
        with:
          repository: pyenv/pyenv
          ref: master
          token: ${{ steps.generate-token.outputs.token }}
          path: catalog
      - name: Update binary record
        run: |
          definition_sha="$(bash .github/scripts/update_binary_record.sh \
            "$version" "dist/$entry" catalog/plugins/pyenv-binary/share/pyenv-binary/versions)"
          archive_sha="$(shasum -a 256 "dist/$entry.tar.xz")"
          echo "definition_sha=$definition_sha" >> "$GITHUB_ENV"
          echo "archive_sha=${archive_sha%% *}" >> "$GITHUB_ENV"
      - name: Create record Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: catalog
          add-paths: plugins/pyenv-binary/share/pyenv-binary/versions/${{ env.version }}
          branch: auto_add_binary/${{ env.entry }}
          title: 'pyenv-binary: update ${{ env.entry }}'
          commit-message: 'pyenv-binary: update ${{ env.entry }}'
          draft: always-true
          body: |
            Updates the definition checksum for `${{ env.entry }}`.

            Website update: ${{ steps.site-pr.outputs.pull-request-url || 'No website changes in this run; verify the deployed files.' }}
            Built from pyenv/pyenv@${{ github.sha }} in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Before marking this PR ready and merging it:
            - [ ] Merge and deploy the website update, if needed.
            - [ ] Check the SHA256 of the served [definition](https://pyenv.github.io/pythons/binaries/${{ env.entry }}) is `${{ env.definition_sha }}`.
            - [ ] Check the SHA256 of the served [archive](https://pyenv.github.io/pythons/binaries/${{ env.entry }}.tar.xz) is `${{ env.archive_sha }}`.

            Part of pyenv/pyenv#2334.
          token: ${{ steps.generate-token.outputs.token }}
